# ---------------------------------------------------------------------------
# Microservice stack
#   frontend (Next.js)  ->  gateway (Express)  ->  user / product / shopping
#   each backend service owns its OWN Postgres database (DB-per-service)
# ---------------------------------------------------------------------------

services:
  # ----------------------------- Databases -------------------------------
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:16-alpine
    container_name: product-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  shopping-db:
    image: postgres:16-alpine
    container_name: shopping-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_db
    ports:
      - "5435:5432"
    volumes:
      - shopping-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------- Message broker ----------------------------
  # RabbitMQ is the event bus. Services publish domain events to a topic
  # exchange (domain.events) and consume from their own durable queue.
  # Management UI: http://localhost:15672  (guest / guest)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------- Cache -----------------------------------
  # Redis backs the cache-aside layer on user-service's GET /users.
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6380", "--requirepass", "root"]
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "root", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------- Services --------------------------------
  user-service:
    build: ./services/user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/user_db?schema=public
      JWT_SECRET: super-secret-change-me
      JWT_EXPIRES_IN: 1d
      # event-driven (RabbitMQ topic exchange)
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EVENTS_EXCHANGE: domain.events
      # cache-aside on GET /users
      REDIS_URL: redis://redis:6380
      REDIS_PASSWORD: root
      CACHE_TTL_SECONDS: 60
    ports:
      - "4001:4001"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://postgres:postgres@product-db:5432/product_db?schema=public
      JWT_SECRET: super-secret-change-me
      # event-driven: publishes product.* and consumes order.* via RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EVENTS_EXCHANGE: domain.events
      # cache-aside on GET /products
      REDIS_URL: redis://redis:6380
      REDIS_PASSWORD: root
      PRODUCT_CACHE_TTL_SECONDS: 30
    ports:
      - "4002:4002"
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shopping-service:
    build: ./services/shopping-service
    container_name: shopping-service
    restart: unless-stopped
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://postgres:postgres@shopping-db:5432/shopping_db?schema=public
      JWT_SECRET: super-secret-change-me
      # synchronous calls to product-service (stock saga, bulk fetch)
      PRODUCT_SERVICE_URL: http://product-service:4002
      # event-driven: publishes order.* and consumes product.* via RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EVENTS_EXCHANGE: domain.events
    ports:
      - "4003:4003"
    depends_on:
      shopping-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------------- Gateway ---------------------------------
  gateway:
    build: ./gateway
    container_name: gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: super-secret-change-me
      USER_SERVICE_URL: http://user-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      SHOPPING_SERVICE_URL: http://shopping-service:4003
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - shopping-service

  # ----------------------------- Frontend --------------------------------
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      # browser talks to the gateway on the host
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  user-db-data:
  product-db-data:
  shopping-db-data:
