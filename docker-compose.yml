# ---------------------------------------------------------------------------
# Microservice stack
#   frontend (Next.js)  ->  gateway (Express)  ->  user / product / shopping
#   each backend service owns its OWN Postgres database (DB-per-service)
# ---------------------------------------------------------------------------

# --- Shared Kafka broker config (merged into kafka-1/2/3 via YAML anchors) ---
# Each broker reuses these; only node id + listeners differ per node.
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.8.0          # อิมเมจ Kafka (Confluent) เวอร์ชัน 7.8.0 ที่ทุก node ใช้ร่วมกัน
  restart: unless-stopped                     # ถ้า container ล่ม ให้ Docker สตาร์ทใหม่อัตโนมัติ (ยกเว้นเราสั่งหยุดเอง)
  healthcheck:                                # วิธีเช็คว่า node "พร้อมใช้งานจริง" ไหม (service อื่นรอจนผ่านก่อนค่อยเริ่ม)
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]  # ลองคุยกับ broker ตัวเอง ถ้าตอบได้ = healthy
    interval: 10s                             # เช็คซ้ำทุก 10 วินาที
    timeout: 10s                              # แต่ละครั้งรอผลไม่เกิน 10 วินาที ถ้าเกินถือว่าพลาด
    retries: 10                               # พลาดติดกัน 10 ครั้งถึงจะตัดสินว่า node นี้ unhealthy

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller      # node นี้ทำทั้ง 2 บทบาท: broker (เก็บ/ส่ง event) + controller (ดูแล metadata)
  # All 3 nodes vote in the KRaft controller quorum (need a majority = 2 alive).
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093  # รายชื่อ controller ทั้ง 3 ตัวที่โหวตเลือกผู้นำ (ต้องมีชีวิตเกินครึ่ง = 2)
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT  # แต่ละช่องทาง (listener) ใช้ความปลอดภัยแบบไหน — ที่นี่ PLAINTEXT (ไม่เข้ารหัส) ทั้งหมดเพื่อความง่ายตอน dev
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # ช่องทางชื่อ CONTROLLER ใช้สำหรับการคุยกันของ controller (KRaft) เท่านั้น
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL  # broker คุยกันเอง (เช่น ทำสำเนา replica) ผ่านช่องทางชื่อ INTERNAL
  # KRaft needs a cluster id up front; this fixed base64 UUID lets every broker
  # auto-format its storage deterministically on first boot (same id = one cluster).
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk          # รหัสประจำคลัสเตอร์ (UUID) — ตั้งค่าเดียวกันทั้ง 3 node = นับเป็นคลัสเตอร์เดียวกัน
  # 3 nodes: replicate the cluster-internal topics 3x and require 2 in sync.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3   # topic ภายในที่เก็บ offset ของ consumer (__consumer_offsets) ทำสำเนา 3 ชุด
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3  # topic ภายในที่เก็บสถานะ transaction ทำสำเนา 3 ชุด (ทน node ล่ม)
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2      # เขียน transaction state ต้องมีสำเนาตรงกันอย่างน้อย 2 ชุดถึงจะสำเร็จ
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # ไม่หน่วงเวลาก่อนจัด partition ใหม่ให้ consumer group (dev ใช้ได้ทันที, prod มักตั้งหน่วงไว้)
  # Auto-created topics get 3 partitions, each replicated across all 3 nodes,
  # and a write needs 2 in-sync replicas (survives losing 1 node).
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"     # ถ้า publish/subscribe topic ที่ยังไม่มี ให้สร้าง topic นั้นให้อัตโนมัติ
  KAFKA_NUM_PARTITIONS: 3                      # topic ที่ถูกสร้างอัตโนมัติ จะมี 3 partition (กระจายโหลด/อ่านขนานได้ 3 ทาง)
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3         # แต่ละ partition ทำสำเนา 3 ชุด กระจายข้าม 3 node (ทน node ล่มได้)
  KAFKA_MIN_INSYNC_REPLICAS: 2                # เขียน event สำเร็จต้องมีสำเนาตรงกันอย่างน้อย 2 ชุด (ทน node ล่ม 1 ตัวโดยไม่เสียข้อมูล)

services:
  # ----------------------------- Databases -------------------------------
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    volumes:
      - product-db-data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  shopping-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_db
    ports:
      - "5435:5432"
    volumes:
      - shopping-db-data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------- Message broker ----------------------------
  # Kafka (KRaft mode — no ZooKeeper) is the event bus, run as a 3-NODE CLUSTER.
  # Every node is both broker + controller. Topics default to 3 partitions with
  # replication factor 3, so each partition has a leader + 2 replicas spread
  # across the nodes: the cluster keeps serving if any one node dies, and
  # partition leadership is balanced so producer/consumer load fans out.
  #   - in-cluster clients connect on  kafka-1:29092,kafka-2:29092,kafka-3:29092
  #   - host tools connect on          localhost:9092 / 9094 / 9095
  #
  # Settings shared by every broker (per-node id/listeners are set below):
  kafka-1:
    <<: *kafka-common
    ports:
      - "9092:9092" # external (host) access -> this node
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092

  kafka-2:
    <<: *kafka-common
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094

  kafka-3:
    <<: *kafka-common
    ports:
      - "9095:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9095

  # Web console for Kafka (the broker image has no built-in UI). Browse
  # topics, inspect messages, and watch per-service consumer-group lag at
  # http://localhost:8081 (8080 is taken by the gateway). Point it at all three
  # brokers so it still shows the cluster if one node is down.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # ----------------------------- Cache -----------------------------------
  # Redis backs the cache-aside layer on user-service's GET /users.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--port", "6380", "--requirepass", "root"]
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "root", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------- Services --------------------------------
  user-service:
    build: ./services/user-service
    restart: unless-stopped
    environment:
      # gRPC-only service (no HTTP); the gateway reaches it over gRPC
      GRPC_PORT: 50051
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/user_db?schema=public
      JWT_SECRET: super-secret-change-me
      JWT_EXPIRES_IN: 1d
      # event-driven (Kafka — one topic per event type)
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLIENT_ID: user-service
      # cache-aside on the users list
      REDIS_URL: redis://redis:6380
      REDIS_PASSWORD: root
      CACHE_TTL_SECONDS: 60
    ports:
      - "50051:50051"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    restart: unless-stopped
    environment:
      # gRPC-only service (no HTTP); the gateway and shopping-service reach it over gRPC
      GRPC_PORT: 50052
      DATABASE_URL: postgresql://postgres:postgres@product-db:5432/product_db?schema=public
      JWT_SECRET: super-secret-change-me
      # event-driven: publishes product.* and consumes order.* via Kafka
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLIENT_ID: product-service
      # cache-aside on the products list
      REDIS_URL: redis://redis:6380
      REDIS_PASSWORD: root
      PRODUCT_CACHE_TTL_SECONDS: 30
    ports:
      - "50052:50052"
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  shopping-service:
    build: ./services/shopping-service
    restart: unless-stopped
    environment:
      # gRPC-only service (no HTTP); the gateway reaches it over gRPC
      GRPC_PORT: 50053
      DATABASE_URL: postgresql://postgres:postgres@shopping-db:5432/shopping_db?schema=public
      JWT_SECRET: super-secret-change-me
      # synchronous gRPC calls to product-service (stock saga, bulk fetch)
      PRODUCT_GRPC_ADDR: product-service:50052
      # event-driven: publishes order.* and consumes product.* via Kafka
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLIENT_ID: shopping-service
    ports:
      - "50053:50053"
    depends_on:
      shopping-db:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # ----------------------------- Gateway ---------------------------------
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: super-secret-change-me
      # gateway translates browser REST -> backend gRPC
      USER_GRPC_ADDR: user-service:50051
      PRODUCT_GRPC_ADDR: product-service:50052
      SHOPPING_GRPC_ADDR: shopping-service:50053
      # Live stock push: gateway consumes product.stock.changed and fans out on /ws
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLIENT_ID: gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - shopping-service
      - kafka-1
      - kafka-2
      - kafka-3

  # ----------------------------- Frontend --------------------------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # browser talks to the gateway on the host
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  user-db-data2:
  product-db-data2:
  shopping-db-data2:
