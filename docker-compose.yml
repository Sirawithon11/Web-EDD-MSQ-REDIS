# ---------------------------------------------------------------------------
# Microservice stack
#   frontend (Next.js)  ->  gateway (Express)  ->  user / product / shopping
#   each backend service owns its OWN Postgres database (DB-per-service)
# ---------------------------------------------------------------------------

services:
  # ----------------------------- Databases -------------------------------
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  shopping-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_db
    ports:
      - "5435:5432"
    volumes:
      - shopping-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------- Message broker ----------------------------
  # Kafka (KRaft mode — no ZooKeeper) is the event bus. Services produce domain
  # events to a topic named after the event type (e.g. "product.created") and
  # each service consumes via its own consumer group.
  #   - in-cluster clients connect on  kafka:29092  (INTERNAL listener)
  #   - host tools connect on          localhost:9092 (EXTERNAL listener)
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    restart: unless-stopped
    ports:
      - "9092:9092" # external (host) access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # KRaft needs a cluster id up front; this one is a fixed base64 UUID so the
      # broker auto-formats its storage deterministically on first boot.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # single-node: keep all replication factors at 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics are auto-created on first publish/subscribe (1 partition each)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web console for Kafka (the broker image has no built-in UI). Browse
  # topics, inspect messages, and watch per-service consumer-group lag at
  # http://localhost:8081 (8080 is taken by the gateway).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ----------------------------- Cache -----------------------------------
  # Redis backs the cache-aside layer on user-service's GET /users.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--port", "6380", "--requirepass", "root"]
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "root", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------- Services --------------------------------
  user-service:
    build: ./services/user-service
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/user_db?schema=public
      JWT_SECRET: super-secret-change-me
      JWT_EXPIRES_IN: 1d
      # event-driven (Kafka — one topic per event type)
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: user-service
      # cache-aside on GET /users
      REDIS_URL: redis://redis:6380
      REDIS_PASSWORD: root
      CACHE_TTL_SECONDS: 60
    ports:
      - "4001:4001"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://postgres:postgres@product-db:5432/product_db?schema=public
      JWT_SECRET: super-secret-change-me
      # event-driven: publishes product.* and consumes order.* via Kafka
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: product-service
      # cache-aside on GET /products
      REDIS_URL: redis://redis:6380
      REDIS_PASSWORD: root
      PRODUCT_CACHE_TTL_SECONDS: 30
    ports:
      - "4002:4002"
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  shopping-service:
    build: ./services/shopping-service
    restart: unless-stopped
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://postgres:postgres@shopping-db:5432/shopping_db?schema=public
      JWT_SECRET: super-secret-change-me
      # synchronous calls to product-service (stock saga, bulk fetch)
      PRODUCT_SERVICE_URL: http://product-service:4002
      # event-driven: publishes order.* and consumes product.* via Kafka
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: shopping-service
    ports:
      - "4003:4003"
    depends_on:
      shopping-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ----------------------------- Gateway ---------------------------------
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: super-secret-change-me
      USER_SERVICE_URL: http://user-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      SHOPPING_SERVICE_URL: http://shopping-service:4003
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - shopping-service

  # ----------------------------- Frontend --------------------------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # browser talks to the gateway on the host
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  user-db-data:
  product-db-data:
  shopping-db-data:
